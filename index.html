<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>轻账 · 记账</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<!-- ========== 样式 ==========
     顺序：基础骨架 → 页面 → 记一笔 → 通用组件 -->
<link rel="stylesheet" href="css/00-base.css?v=20261029c">
<link rel="stylesheet" href="css/10-views.css?v=20261029c">
<link rel="stylesheet" href="css/20-record.css?v=20261029c">
<link rel="stylesheet" href="css/30-components.css?v=20261029c">
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="wc"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="3" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="wc2"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter>
  </defs>
</svg>

<div class="app">

  <!-- 首页 -->
  <section class="view on" id="v-home">
    <svg class="wash" width="390" height="330" viewBox="0 0 390 330"><g filter="url(#wc)" opacity=".55"><ellipse cx="195" cy="150" rx="140" ry="118" fill="#C9DFF2"/><ellipse cx="175" cy="140" rx="112" ry="96" fill="#DCEBF8" opacity=".8"/><ellipse cx="240" cy="190" rx="82" ry="60" fill="#D3E5F6" opacity=".7"/></g><g filter="url(#wc2)" opacity=".4"><ellipse cx="300" cy="70" rx="66" ry="46" fill="#BFD9F0"/><ellipse cx="70" cy="240" rx="54" ry="34" fill="#D6E8F6"/><ellipse cx="330" cy="205" rx="42" ry="30" fill="#E4EFF9"/><ellipse cx="105" cy="78" rx="46" ry="30" fill="#C7DEF1"/></g><g filter="url(#wc2)" opacity=".3"><ellipse cx="58" cy="120" rx="34" ry="24" fill="#F0E7D8"/><ellipse cx="322" cy="268" rx="38" ry="24" fill="#DFEDE3"/></g></svg>
    <div class="status"><span id="clock">--:--</span><span>轻账</span></div>
    <div class="bodyz">
      <div class="hero">
        <div class="date" id="h-date">—</div>
        <div class="amt-label">今日支出</div>
        <div class="amt"><span class="cny">¥</span><span id="h-today">0.00</span></div>
        <div class="amt-sub">本月总消费 <b>¥ <span id="h-month">0.00</span></b></div>
        <div id="h-chip"></div>
      </div>
      <div id="h-budget"></div>
      <div class="card">
        <div class="card-head"><h3>收支明细</h3><a onclick="go('v-detail',1)">全部 &rsaquo;</a></div>
        <div id="h-list"></div>
      </div>
    </div>
  </section>

  <!-- 明细 -->
  <section class="view" id="v-detail">
    <svg class="wash" width="390" height="180" viewBox="0 0 390 180"><g filter="url(#wc)" opacity=".4"><ellipse cx="120" cy="50" rx="150" ry="90" fill="#DCEBF8"/><ellipse cx="170" cy="80" rx="85" ry="55" fill="#D0E4F5" opacity=".7"/></g><g filter="url(#wc2)" opacity=".32"><ellipse cx="320" cy="45" rx="60" ry="38" fill="#C7DEF1"/><ellipse cx="45" cy="120" rx="38" ry="22" fill="#F0E7D8"/></g></svg>
    <div class="status"><span id="clock2">--:--</span><span>明细</span></div>
    <div class="bodyz">
      <div class="mtitle" onclick="toggleCal()">
        <span id="d-title">9 月</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink3)" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button class="arrow" onclick="event.stopPropagation();shiftMonth(-1)">‹</button>
          <button class="arrow" onclick="event.stopPropagation();shiftMonth(1)">›</button>
        </div>
      </div>
      <div class="cal" id="cal"></div>
      <div class="sum">
        <div><p>收入</p><b style="color:var(--green)" id="d-in">0</b></div>
        <div><p>支出</p><b id="d-out">0</b></div>
        <div><p>结余</p><b style="color:var(--blue-d)" id="d-net">0</b></div>
      </div>
      <div class="card" style="margin-top:18px" id="d-list"></div>
    </div>
  </section>

  <!-- 统计 -->
  <section class="view" id="v-stat">
    <svg class="wash" width="390" height="220" viewBox="0 0 390 220"><g filter="url(#wc)" opacity=".42"><ellipse cx="230" cy="70" rx="150" ry="100" fill="#DCEBF8"/><ellipse cx="185" cy="100" rx="88" ry="58" fill="#D0E4F5" opacity=".7"/></g><g filter="url(#wc2)" opacity=".32"><ellipse cx="70" cy="60" rx="52" ry="34" fill="#C7DEF1"/><ellipse cx="335" cy="150" rx="40" ry="24" fill="#DFEDE3"/></g></svg>
    <div class="status"><span id="clock3">--:--</span><span>统计</span></div>
    <div class="bodyz">
      <div id="s-back"></div>
      <div class="stitle">
        <span id="s-title">本月支出构成</span>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button class="arrow" onclick="shiftMonth(-1)">‹</button>
          <button class="arrow" onclick="shiftMonth(1)">›</button>
        </div>
      </div>
      <div class="donut-wrap" id="s-donut">
        <div style="flex:0 0 auto;width:150px;height:150px"><canvas id="donutCv"></canvas></div>
        <div class="legend" id="s-legend"></div>
      </div>
      <div id="s-charts">
        <div class="card" style="margin-top:20px">
          <div class="card-head"><h3 id="s-daytitle">每日支出</h3><span style="font-size:11.5px;color:var(--ink3)">单位 元</span></div>
          <div style="height:150px;padding-top:8px"><canvas id="dayCv"></canvas></div>
        </div>
        <div class="card" style="margin-top:20px">
          <div class="card-head"><h3>近 6 个月趋势</h3><span style="font-size:11.5px;color:var(--ink3)">单位 元</span></div>
          <div style="height:170px;padding-top:8px"><canvas id="barCv"></canvas></div>
        </div>
      </div>
      <!-- 三级下钻（二级分类）：用当月逐条流水替换下方两个图表 -->
      <div class="card" id="s-rec" style="margin-top:20px;display:none">
        <div class="card-head"><h3 id="s-dtitle">明细</h3><span id="s-dsum" style="font-size:11.5px;color:var(--ink3)"></span></div>
        <div id="s-rlist" style="margin-top:4px"></div>
      </div>
    </div>
  </section>

  <!-- 我的 -->
  <section class="view" id="v-me">
    <svg class="wash" width="390" height="200" viewBox="0 0 390 200"><g filter="url(#wc)" opacity=".4"><ellipse cx="90" cy="60" rx="150" ry="95" fill="#DCEBF8"/><ellipse cx="140" cy="92" rx="88" ry="58" fill="#D0E4F5" opacity=".75"/></g><g filter="url(#wc2)" opacity=".34"><ellipse cx="312" cy="48" rx="68" ry="44" fill="#C7DEF1"/><ellipse cx="255" cy="115" rx="44" ry="26" fill="#E4EFF9"/><ellipse cx="40" cy="132" rx="38" ry="22" fill="#F0E7D8"/></g></svg>
    <div class="status"><span id="clock4">--:--</span><span>我的</span></div>
    <div class="bodyz">
      <div class="me-top">
        <div class="avatar">轻</div>
        <div><p>阿发的账本</p><span id="m-streak">已连续记账 0 天</span></div>
      </div>
      <div class="sum">
        <div class="tap" onclick="openBudget()"><p>本月预算</p><b id="m-budget">0</b></div>
        <div><p>日均支出</p><b id="m-avg">0</b></div>
        <div class="tap" onclick="openStartBalance()"><p>总余额</p><b id="m-balance">0</b></div>
      </div>
      <div class="list">
        <div class="row-l" onclick="openCats()"><div class="ico" style="width:32px;height:32px;border-radius:11px;background:#EDEBF7;color:#736FAE">类</div>分类管理<em id="m-cat-em">0 个</em></div>
        <div class="row-l" onclick="openBackup()"><div class="ico" style="width:32px;height:32px;border-radius:11px;background:#E6F2EC;color:#4E9376">备</div>备份与导出<em>JSON / CSV</em></div>
        <div class="row-l" onclick="openSettings()"><div class="ico" style="width:32px;height:32px;border-radius:11px;background:#F1EFE9;color:#8A8B84">设</div>设置<em></em></div>
      </div>
    </div>
  </section>

  <!-- 记一笔（独立全屏页） -->
  <section class="view" id="v-record" style="padding-bottom:24px">
    <svg class="wash" width="390" height="200" viewBox="0 0 390 200"><g filter="url(#wc)" opacity=".45"><ellipse cx="200" cy="60" rx="150" ry="90" fill="#DCEBF8"/><ellipse cx="155" cy="90" rx="85" ry="55" fill="#D0E4F5" opacity=".7"/></g><g filter="url(#wc2)" opacity=".32"><ellipse cx="330" cy="55" rx="55" ry="34" fill="#C7DEF1"/><ellipse cx="55" cy="125" rx="36" ry="22" fill="#F0E7D8"/></g></svg>
    <div class="status"><span id="clock5">--:--</span><span id="r-title">记一笔</span></div>
    <div class="bodyz">
      <div class="rec-top">
        <div class="seg">
          <button id="seg-e" class="on" onclick="setType('expense')">支出</button>
          <button id="seg-i" onclick="setType('income')">收入</button>
        </div>
        <span class="datepill" id="r-datepill" onclick="openDate()"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg><span id="r-datelabel">今天</span></span>
      </div>
      <i id="amt-sentinel" style="display:block;height:0"></i>
      <div class="rec-amount"><span class="cur">¥</span><span id="r-amt">0</span><span class="eq" id="r-amthint"></span></div>
      <div class="rec-note" id="r-note" onclick="editNote()">备注：点这里写点什么</div>
      <div class="rec-toggle" onclick="toggleInMonth()">
        <div>计入本月统计<small id="r-imhint">大额支出可关闭，不碰生活费预算与统计</small></div>
        <div class="switch on" id="r-inmonth"><i></i></div>
      </div>
      <div class="cats" id="r-cats"></div>
      <div class="subwrap">
        <div class="subwrap-l" id="r-sublabel">二级分类</div>
        <div class="subs" id="r-subs"></div>
      </div>
      <div class="keys" id="r-keys"></div>
      <div class="save off" id="r-save" onclick="saveRecord()">保存这一笔</div>
      <div style="text-align:center;padding:4px 0 8px"><span id="r-back" style="display:none;font-size:12.5px;color:var(--blue-d);cursor:pointer;margin-right:22px" onclick="closeRecord()">返回</span><span id="r-cancel" style="font-size:12.5px;color:var(--ink3);cursor:pointer">取消</span></div>
    </div>
  </section>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-v="v-home" data-i="0"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>首页</button>
    <button class="tab" data-v="v-detail" data-i="1"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>明细</button>
    <button class="fab" onclick="openRecord()" aria-label="记一笔"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-v="v-stat" data-i="2"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>统计</button>
    <button class="tab" data-v="v-me" data-i="3"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.6 4.1-5.4 7.5-5.4S18.1 16.4 19.5 20"/></svg>我的</button>
  </nav>

</div>

<svg class="grain" width="100%" height="100%"><rect width="100%" height="100%" filter="url(#grain)"/></svg>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<!-- ========== 第三方库（本地副本，完全离线可用，不依赖 CDN） ========== -->
<script src="vendor/dexie.min.js"></script>
<script src="vendor/chart.umd.min.js"></script>

     顺序即依赖关系，请勿随意调整：
       00-04  核心层（配置 / 工具 / 数据 / 领域 / UI 基础）
       10-13  视图层
       20-32  功能层
       40-99  路由与启动（99-main.js 必须最后） -->
<script src="js/00-config.js?v=20261029c"></script>
<script src="js/01-utils.js?v=20261029c"></script>
<script src="js/02-db.js?v=20261029c"></script>
<script src="js/03-domain.js?v=20261029c"></script>
<script src="js/04-ui.js?v=20261029c"></script>

<script src="js/10-home.js?v=20261029c"></script>
<script src="js/11-detail.js?v=20261029c"></script>
<script src="js/12-stat.js?v=20261029c"></script>
<script src="js/13-me.js?v=20261029c"></script>

<script src="js/20-record.js?v=20261029c"></script>
<script src="js/30-budget.js?v=20261029c"></script>
<script src="js/31-categories.js?v=20261029c"></script>
<script src="js/32-backup.js?v=20261029c"></script>

<script src="js/40-router.js?v=20261029c"></script>
<script src="js/99-main.js?v=20261029c"></script>
</body>
</html>
